<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>粵語語音轉繁體中文</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; margin: 24px; }
    .card { max-width: 720px; margin: 0 auto; padding: 24px; border: 1px solid #ddd; border-radius: 8px; }
    .row { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    input[type="file"] { width: 100%; }
    select { width: 100%; padding: 8px; }
    button { padding: 10px 16px; border: none; border-radius: 6px; background: #1f6feb; color: #fff; cursor: pointer; }
    button:hover { background: #1a5fcc; }
  </style>
</head>
<body>
  <div class="card">
    <h1>粵語語音轉繁體中文</h1>
    <form action="{{ url_for('transcribe') }}" method="post" enctype="multipart/form-data">
      <div class="row">
        <label>選擇語音檔（可多選）</label>
        <input type="file" name="files" multiple accept=".ogg,.opus,.m4a,.mp3,.wav" />
      </div>
      <input type="hidden" name="model" value="medium" />
      <input type="hidden" name="language" value="zh" />
      <button type="submit">開始轉換</button>
    </form>
  </div>
</body>
</html>
