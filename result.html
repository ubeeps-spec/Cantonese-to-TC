<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>轉換結果</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; margin: 24px; }
    .card { max-width: 960px; margin: 0 auto; padding: 24px; border: 1px solid #ddd; border-radius: 8px; }
    pre { white-space: pre-wrap; word-wrap: break-word; background: #f7f7f8; padding: 16px; border-radius: 6px; }
    .item { margin-bottom: 24px; }
    a { color: #1f6feb; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>轉換結果</h1>
    <pre>{% for r in results %}{{ r.text }}{% if not loop.last %}\n\n{% endif %}{% endfor %}</pre>
    <p><a href="{{ url_for('index') }}">返回上傳</a></p>
  </div>
</body>
</html>
